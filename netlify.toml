[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  publish = "."
  functions = "netlify/functions"
  port = 8888

# ── Security Audit: Block access to sensitive files ──────────
[[redirects]]
  from = "/.env*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package*.json"
  to = "/index.html"
  status = 404
  force = true

# ── Security Headers ─────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
